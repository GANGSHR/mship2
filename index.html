<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苷舍 gangshr｜訂單查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --cream:#FFFBFC;
    --cream-2:#FBEEF1;
    --card:#FFFFFF;
    --latte:#E3A0A8;
    --latte-dark:#C97D89;
    --ink:#5A4A4D;
    --ink-soft:#A88B90;
    --line:#F5DEE3;
    --ok:#6E9C7B;
    --ok-bg:#EDF5EE;
    --warn:#C08A5C;
    --warn-bg:#FBF1E6;
    --bad:#C46B6B;
    --bad-bg:#FBECEC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
    background:linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 20px;}
  header.top{
    padding:40px 20px 24px;
    text-align:center;
  }
  header.top .brand{
    font-size:14px;
    letter-spacing:4px;
    color:var(--latte-dark);
    font-weight:700;
    margin-bottom:6px;
  }
  header.top h1{
    font-size:26px;
    margin:0 0 8px;
    font-weight:900;
    color:var(--ink);
  }
  header.top p{
    margin:0;
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.7;
  }
  .search-card{
    background:var(--card);
    border-radius:20px;
    padding:24px 20px;
    box-shadow:0 6px 24px rgba(122,98,64,0.08);
    margin-bottom:24px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--latte-dark);
    margin-bottom:6px;
  }
  .field .hint{
    font-weight:400;
    color:var(--ink-soft);
    font-size:12px;
    margin-left:6px;
  }
  .field input{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    font-size:16px;
    font-family:inherit;
    background:#FFFCFD;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus{border-color:var(--latte);}
  button.search-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--latte-dark);
    color:#fff;
    font-size:16px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    margin-top:4px;
    transition:background .15s, transform .1s;
  }
  button.search-btn:active{transform:scale(0.98);}
  button.search-btn:hover{background:#B36A76;}
  button.search-btn:disabled{background:#EBC6CB;cursor:not-allowed;}

  #status-msg{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:20px 0;
  }

  .order-card{
    background:var(--card);
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 4px 16px rgba(122,98,64,0.07);
    border:1px solid var(--line);
  }
  .order-card .top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .top-row .left-tags{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .tag{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
    background:var(--cream-2);
    color:var(--latte-dark);
    white-space:nowrap;
  }
  .tag.delivery{background:#F7E3E7;color:var(--latte-dark);}
  .tag.pickup{background:#FBEEF1;color:var(--latte-dark);}
  .status-badge{
    font-size:12px;
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .status-ok{background:var(--ok-bg);color:var(--ok);}
  .status-warn{background:var(--warn-bg);color:var(--warn);}
  .status-bad{background:var(--bad-bg);color:var(--bad);}

  /* 訂單進度步驟條 */
  .progress-block{
    margin:14px 0 16px;
    padding-bottom:16px;
    border-bottom:1px dashed var(--line);
  }
  .stepper{
    display:flex;
    align-items:flex-start;
    padding:0 2px;
  }
  .step{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    min-width:0;
  }
  .step:not(:last-child)::after{
    content:'';
    position:absolute;
    top:10px;
    left:calc(50% + 14px);
    width:calc(100% - 28px);
    height:2px;
    background:var(--line);
    z-index:0;
  }
  .step.completed:not(:last-child)::after{background:var(--latte);}
  .step .dot{
    width:22px;
    height:22px;
    border-radius:50%;
    background:#fff;
    border:2px solid var(--line);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:900;
    z-index:1;
    transition:background .15s, border-color .15s, box-shadow .15s;
  }
  .step.completed .dot{background:var(--latte-dark);border-color:var(--latte-dark);}
  .step.current .dot{background:#fff;border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-bg);}
  .step .label{
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:6px;
    text-align:center;
    line-height:1.3;
    white-space:nowrap;
  }
  .step.completed .label{color:var(--latte-dark);font-weight:700;}
  .step.current .label{color:var(--warn);font-weight:700;}
  .step-link{display:contents;cursor:pointer;}
  .step-link:hover .dot{box-shadow:0 0 0 3px var(--cream-2);}
  .step-link:hover .label{text-decoration:underline;}
  .track-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:auto;
    max-width:100%;
    padding:9px 20px;
    margin:14px auto 0;
    border-radius:999px;
    background:var(--latte-dark);
    color:#fff;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
  }
  .track-btn-wrap{display:flex;justify-content:center;}
  .track-btn:hover{background:#B36A76;}
  .track-btn:active{transform:scale(0.98);}

  .buyer-name{
    font-size:18px;
    font-weight:900;
    color:var(--ink);
    margin-bottom:4px;
  }
  .order-time{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .section{margin-bottom:12px;}
  .section-label{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .section-value{
    font-size:14.5px;
    color:var(--ink);
    line-height:1.6;
  }
  .items-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .items-list li{
    display:flex;
    align-items:baseline;
    padding:6px 0;
    border-bottom:1px dashed var(--line);
    font-size:14.5px;
    gap:8px;
  }
  .items-list li:last-child{border-bottom:none;}
  .items-list .name{white-space:nowrap;}
  .items-list .fill{
    flex:1;
    border-bottom:1px dotted var(--ink-soft);
    opacity:0.4;
    margin-bottom:4px;
    min-width:12px;
  }
  .items-list .qty{color:var(--latte-dark);font-weight:700;white-space:nowrap;}
  .amount-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:12px;
    margin-top:8px;
    border-top:1.5px solid var(--line);
  }
  .amount-row .label{font-size:14px;color:var(--ink-soft);}
  .amount-row .value{font-size:20px;font-weight:900;color:var(--latte-dark);}

  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
  }
  .empty-state .icon{font-size:40px;margin-bottom:10px;}
  .empty-state p{font-size:14px;line-height:1.8;margin:4px 0;}

  footer.contact{
    max-width:640px;
    margin:30px auto 0;
    padding:0 20px;
    text-align:center;
  }
  footer.contact p{font-size:13px;color:var(--ink-soft);margin-bottom:10px;}
  .contact-links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .contact-links a{
    display:inline-block;
    padding:10px 18px;
    border-radius:999px;
    background:#fff;
    color:var(--latte-dark);
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    border:1.5px solid var(--line);
  }
</style>
</head>

<header class="top">

      <label for="phoneInput">聯絡電話</label>
      <input id="phoneInput" type="tel" placeholder="請輸入訂購時填寫的手機號碼" autocomplete="tel" inputmode="numeric" onkeydown="if(event.key==='Enter') runSearch();">

  </div>

<script>
/* =========================================================================
   設定區：請在這裡管理您的訂單資料來源
   -------------------------------------------------------------------------
   每一款訂單（宅配 / 自取）各自對應一個「已發布為 CSV」的 Google 試算表連結。
   之後不管是新增檔期、新增商品，只要欄位命名邏輯不變（例如商品名稱直接當
   欄位標題、數量填在該欄），完全不需要改這支程式，只要：
     1. 開新的訂單表單 → Google 表單會自動建立新的回覆試算表
     2. 把新試算表「發布到網路」→ 選擇 CSV 格式 → 複製連結
     3. 把連結貼到下方陣列，或直接取代舊的連結（若沿用同一份表單）
   ========================================================================= */
const ORDER_SOURCES = [
  {
    type: "delivery",
    label: "宅配",
    csvUrl: "https://docs.google.com/spreadsheets/d/19mBrq4YV4k50hMVYKpiihWkhbo8Wx1ZuAsofOFCA6u8/export?format=csv&gid=0"
  },
  {
    type: "pickup",
    label: "自取",
    csvUrl: "https://docs.google.com/spreadsheets/d/1BQevuwCMU2GujAMycFqsQPJ-uW2MirjeHyh6YSQ5FHw/export?format=csv&gid=0"
  }
  // 若之後同時有第三款訂單在收單（例如活動禮盒），直接在這裡多加一組即可
];

/* -------------------------------------------------------------------------
   訂單進度資料來源（已入單 / 款項確認 / 黑貓宅配編號）
   -----------------------------------------------------------------------
   ★ 只需要改下面這一行網址，換成你自己 Google 試算表「發布到網路」的
     CSV 連結。之後不管是宅配還是自取訂單，妳只要在這份試算表裡打字更新，
     這個網頁就會自動抓到最新資料，完全不用再碰這個 html 檔案。

   試算表欄位請依序設定（第一列標題文字要一模一樣）：
   訂購時間 | 訂購人姓名 | 收件人姓名 | 款項確認 | 收件人電話 | 收件地址 | 黑貓宅配編號

   填寫方式：
   - 訂購時間：直接複製貼上原始訂單試算表裡「送出時間」那一欄的值
     （就是妳平常拉下來對帳、貼到 xlsx 時看到的那個時間戳記）。
     ★ 如果同一支手機號碼曾經填過兩張單（不同天、或宅配+自取都填），
     只靠電話會沒辦法分辨是哪一筆，加上這個不會重複的時間戳記，
     才能準確比對到正確的那一筆訂單。如果確定這支電話只訂過一次，
     這欄留空也可以正常比對。
   - 收件人電話：不管宅配還是自取都填「聯絡電話」，自取訂單就填客人
     自己的手機號碼即可（用來自動比對是哪一筆訂單）；建議設成
     「純文字」格式，避免開頭 0 被吃掉。
   - 款項確認：只要那一格「有填任何文字」（例如打 V、✓ 都可以）就算
     完成付款確認；空白＝尚未確認。這格完全在自己電腦上打開試算表
     勾就好，跟妳現在填黑貓編號的習慣一樣。
     （「已入單」不用另外標示——客人查得到這筆訂單，就代表資料已經
     在系統裡了，網頁會自動把「已入單」顯示成完成狀態。）
   - 收件人姓名／收件地址／黑貓宅配編號：只有宅配訂單需要填，自取訂單
     這三格留空即可，網頁會自動只顯示到「款項確認」為止。
   ========================================================================= */
const TRACKING_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS9wF5xRPeqnDAe_-qkWHGa8U0xMp4t53jIsyLopU32naF5WLt-B63GBxXtp8gD0-CUzsgnyJYFefdb/pub?output=csv";

/* 這些關鍵字出現在欄位標題中，代表這欄是「基本資料 / 費用」而不是「商品品項」 */
const META_KEYWORDS = [
  "時間","戳記","mail","信箱","暱稱","姓名","電話","地址","備註",
  "日期","方案","金額","費用","許願","數量","統編","發票","抬頭","盒數"
];

/* 用來把不同表單的欄位名稱，對應成統一的欄位 key */
const META_MATCHERS = [
  { key: "time",           patterns: ["送出時間", "時間戳記"] },
  { key: "email",          patterns: ["電子郵件", "email", "信箱"] },
  { key: "social",         patterns: ["暱稱"] },
  { key: "buyerName",      patterns: ["訂購人姓名", "中文姓名"] },
  { key: "buyerPhone",     patterns: ["聯絡電話"] },
  { key: "recipientName",  patterns: ["收件人姓名"] },
  { key: "recipientPhone", patterns: ["收件人電話"] },
  { key: "address",        patterns: ["收件地址"] },
  { key: "shipNote",       patterns: ["寄件備註"] },
  { key: "pickupDate",     patterns: ["自取日期"] },
  { key: "wish1",          patterns: ["出貨許願第一順位"] },
  { key: "wish2",          patterns: ["出貨許願第二順位"] },
  { key: "bagQty",         patterns: ["提袋數量"] },
  { key: "bagFee",         patterns: ["提袋加收費用"] },
  { key: "shipPlan",       patterns: ["運費方案", "盒數"] },
  { key: "shipFee",        patterns: ["運費金額"] },
  { key: "productAmount",  patterns: ["商品金額", "商品總金額"] },
  { key: "totalAmount",    patterns: ["合計金額"] }
];

/* =========================== 以下為程式邏輯，一般不需要修改 =========================== */

function normalizeText(s){
  return (s === null || s === undefined) ? "" : String(s).trim();
}
function normalizePhone(s){
  const digits = normalizeText(s).replace(/\D/g, "");
  return digits.slice(-9); // 只比對後9碼，避免補0被試算表吃掉造成無法比對
}
function isNumericValue(v){
  const t = normalizeText(v);
  if (t === "") return false;
  return !isNaN(Number(t));
}
function matchMeta(header){
  const h = normalizeText(header).toLowerCase();
  for (const m of META_MATCHERS){
    if (m.patterns.some(p => h.includes(p.toLowerCase()))) return m.key;
  }
  return null;
}
function isMetaHeader(header){
  const h = normalizeText(header).toLowerCase();
  return META_KEYWORDS.some(k => h.includes(k.toLowerCase()));
}
function looksLikeStatus(v){
  const t = normalizeText(v);
  if (t === "") return false;
  return /✅|❌|⚠️|已確認|已付款|付款|取消|已出貨|已寄出|待確認|退款/.test(t);
}

function parseSheetToOrders(csvText, sourceType, sourceLabel){
  const parsed = Papa.parse(csvText, { skipEmptyLines: true });
  const rows = parsed.data;
  if (!rows || rows.length < 2) return [];
  const headers = rows[0].map(h => normalizeText(h));
  const orders = [];

  for (let r = 1; r < rows.length; r++){
    const row = rows[r];
    if (!row || row.every(c => normalizeText(c) === "")) continue;

    const meta = {};
    const items = [];
    const notes = [];
    let status = "";

    for (let i = 0; i < headers.length; i++){
      const header = headers[i];
      const value = row[i];
      const text = normalizeText(value);
      if (text === "" && header === "") continue;

      const metaKey = header ? matchMeta(header) : null;

      if (metaKey){
        meta[metaKey] = text;
        continue;
      }
      if (header === ""){
        // 沒有標題的欄位：通常是人工加註的「訂單狀態」或備註
        if (looksLikeStatus(text)) status = text;
        else if (text !== "") notes.push(text);
        continue;
      }
      if (isMetaHeader(header)){
        // 其他已知的基本資料/費用類欄位，但沒特別對應到 meta key，先略過顯示
        continue;
      }
      // 其餘欄位視為「商品品項」：欄位名稱＝品項名稱，數值＝數量
      if (isNumericValue(value)){
        const qty = Number(text);
        if (qty > 0){
          items.push({ name: header, qty });
        }
      } else if (text !== ""){
        notes.push(`${header}：${text}`);
      }
    }

    const buyerName = meta.buyerName || "";
    if (!buyerName) continue; // 沒有姓名的空行略過

    orders.push({
      sourceType, sourceLabel,
      time: meta.time || "",
      buyerName,
      buyerPhone: meta.buyerPhone || "",
      email: meta.email || "",
      social: meta.social || "",
      recipientName: meta.recipientName || "",
      recipientPhone: meta.recipientPhone || "",
      address: meta.address || "",
      shipNote: meta.shipNote || "",
      pickupDate: meta.pickupDate || "",
      wish1: meta.wish1 || "",
      wish2: meta.wish2 || "",
      bagQty: meta.bagQty || "",
      bagFee: meta.bagFee || "",
      shipPlan: meta.shipPlan || "",
      shipFee: meta.shipFee || "",
      productAmount: meta.productAmount || "",
      totalAmount: meta.totalAmount || "",
      items, notes, status,
      paidOk: false,    // 稍後比對「款項確認」欄位後更新
      tracking: ""      // 稍後比對黑貓宅配編號後填入
    });
  }
  return orders;
}

let cachedOrders = null;
let cachedTracking = null;

async function loadAllOrders(){
  if (cachedOrders) return cachedOrders;
  const all = [];
  for (const src of ORDER_SOURCES){
    if (!src.csvUrl || src.csvUrl.startsWith("PUT_YOUR_")) continue;
    try{
      const res = await fetch(src.csvUrl + (src.csvUrl.includes("?") ? "&" : "?") + "t=" + Date.now());
      const text = await res.text();
      const orders = parseSheetToOrders(text, src.type, src.label);
      all.push(...orders);
    }catch(e){
      console.error("讀取失敗：", src.label, e);
    }
  }
  cachedOrders = all;
  return all;
}

function loadTrackingData(){
  if (cachedTracking) return Promise.resolve(cachedTracking);
  return new Promise((resolve) => {
    Papa.parse(TRACKING_CSV_URL + (TRACKING_CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now(), {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results){
        cachedTracking = (results.data || []).map(row => ({
          orderer: normalizeText(row["訂購人姓名"]),
          orderTime: normalizeText(row["訂購時間"]),
          paid: normalizeText(row["款項確認"]),
          recipient: normalizeText(row["收件人姓名"]),
          phone: normalizeText(row["收件人電話"]),
          tracking: normalizeText(row["黑貓宅配編號"])
        }));
        resolve(cachedTracking);
      },
      error: function(){
        console.error("宅配進度資料讀取失敗");
        cachedTracking = [];
        resolve(cachedTracking);
      }
    });
  });
}

/* 只要那一格有填任何文字，就算完成該階段 */
function isChecked(v){
  return normalizeText(v) !== "";
}
/* 時間戳記比對用：去除所有空白差異，避免格式差一個空格就比對不到 */
function normalizeTimeKey(s){
  return normalizeText(s).replace(/\s+/g, "");
}

/* 幫每一筆訂單（宅配＋自取）比對出對應的「已入單／款項確認／黑貓宅配編號」。
   比對優先順序：
   1. 電話＋訂購時間都吻合 → 最精準，一定是同一筆訂單
   2. 只有電話吻合，但這支電話在狀態表裡「只出現一次」→ 可以放心比對
   3. 只有電話吻合，但這支電話出現「兩筆以上」且沒有時間可以分辨
      → 不亂猜，維持在「已入單」以前的狀態，避免把不同筆訂單的
        狀態搞混（這種情況只要幫那幾列補上「訂購時間」就會恢復正常）
   找不到電話時，才退而用姓名比對（同樣套用上述唯一性判斷）*/
function findStatusMatch(o, statusList){
  const buyerPhoneNorm = normalizePhone(o.buyerPhone);
  const recipientPhoneNorm = normalizePhone(o.recipientPhone);
  const orderTimeKey = normalizeTimeKey(o.time);

  function byPhone(norm){
    return statusList.filter(t => normalizePhone(t.phone) === norm);
  }
  function byName(){
    return statusList.filter(t =>
      (t.recipient && t.recipient === o.recipientName) ||
      (t.orderer && t.orderer === o.buyerName)
    );
  }

  let candidates = [];
  if (buyerPhoneNorm) candidates = byPhone(buyerPhoneNorm);
  if (!candidates.length && recipientPhoneNorm) candidates = byPhone(recipientPhoneNorm);
  if (!candidates.length) candidates = byName();
  if (!candidates.length) return null;

  if (candidates.length === 1) return candidates[0];

  // 有多筆候選，先用「訂購時間」精準篩選
  if (orderTimeKey){
    const exact = candidates.filter(t => normalizeTimeKey(t.orderTime) === orderTimeKey);
    if (exact.length === 1) return exact[0];
  }
  // 仍然無法唯一判定，不亂猜
  return null;
}

function attachStatus(orders, statusList){
  if (!statusList || !statusList.length) return;
  orders.forEach(o => {
    const match = findStatusMatch(o, statusList);
    if (match){
      o.paidOk = isChecked(match.paid);
      if (o.sourceType === "delivery" && match.tracking){
        o.tracking = match.tracking;
      }
    }
  });
}

function statusClass(status){
  if (/✅|已確認|已付款|已出貨|已寄出/.test(status)) return "status-ok";
  if (/❌|取消|退款/.test(status)) return "status-bad";
  if (status) return "status-warn";
  return "";
}

/* 產生訂單進度步驟條
   宅配：已入單 → 款項確認 → 排單中 → 已出貨（最後一步有黑貓編號時可點擊查詢）
   自取：已入單 → 款項確認（到此結束，不需要額外的取貨欄位） */
function renderProgressStepper(o){
  const isDelivery = o.sourceType === "delivery";
  const labels = isDelivery ? ["已入單", "款項確認", "排單中", "已出貨"] : ["已入單", "款項確認"];

  // 「已入單」不需要另外標示：客人查得到這筆訂單，就代表資料已經在
  // 系統裡了，所以一律視為完成，接下來只看「款項確認」跟黑貓宅配編號
  let doneCount;
  if (isDelivery){
    if (o.tracking) doneCount = 4;
    else if (o.paidOk) doneCount = 2;      // 已入單、款項確認完成，排單中為目前進行式
    else doneCount = 1;
  } else {
    doneCount = o.paidOk ? 2 : 1;
  }

  const trackUrl = (isDelivery && o.tracking)
    ? `https://www.t-cat.com.tw/inquire/TraceDetail.aspx?BillID=${encodeURIComponent(o.tracking)}&ReturnUrl=Trace.aspx`
    : null;

  let html = `<div class="progress-block"><div class="stepper">`;
  labels.forEach((label, idx) => {
    let cls = "step";
    let dot = "";
    if (idx < doneCount){
      cls += " completed";
      dot = "✓";
    } else if (idx === doneCount && doneCount < labels.length){
      cls += " current";
    }
    const isLast = idx === labels.length - 1;
    const wrapOpen = (isLast && trackUrl) ? `<a class="step-link" href="${trackUrl}" target="_blank" rel="noopener">` : "";
    const wrapClose = (isLast && trackUrl) ? `</a>` : "";
    html += `${wrapOpen}<div class="${cls}"><div class="dot">${dot}</div><div class="label">${label}</div></div>${wrapClose}`;
  });
  html += `</div>`;
  if (trackUrl){
    html += `<div class="track-btn-wrap"><a class="track-btn" href="${trackUrl}" target="_blank" rel="noopener">📦 查看宅配出貨進度</a></div>`;
  }
  html += `</div>`;
  return html;
}

function renderOrder(o){
  const tagClass = o.sourceType === "delivery" ? "delivery" : "pickup";
  let html = `<div class="order-card">`;
  html += `<div class="top-row">`;
  html += `<div class="left-tags">`;
  html += `<span class="tag ${tagClass}">${o.sourceLabel}</span>`;
  html += `</div>`;
  if (o.status){
    html += `<span class="status-badge ${statusClass(o.status)}">${escapeHtml(o.status)}</span>`;
  }
  html += `</div>`;
  if (o.buyerName) html += `<div class="buyer-name">${escapeHtml(o.buyerName)}</div>`;
  if (o.time) html += `<div class="order-time">訂購時間：${escapeHtml(o.time)}</div>`;
  html += renderProgressStepper(o);

  // 取件方式資訊
  if (o.sourceType === "pickup" && o.pickupDate){
    html += section("自取時段", escapeHtml(o.pickupDate));
  }
  if (o.sourceType === "delivery"){
    if (o.recipientName || o.recipientPhone){
      html += section("收件人", `${escapeHtml(o.recipientName)}　${escapeHtml(o.recipientPhone)}`);
    }
    if (o.address) html += section("收件地址", escapeHtml(o.address));
    if (o.shipNote) html += section("寄件備註", escapeHtml(o.shipNote));
    if (o.wish1 || o.wish2){
      const wishes = [o.wish1, o.wish2].filter(Boolean).map(escapeHtml).join("　／　");
      html += section("出貨許願日期", wishes);
    }
  }

  // 商品品項
  if (o.items.length){
    html += `<div class="section"><div class="section-label">訂購品項</div><ul class="items-list">`;
    o.items.forEach(it => {
      html += `<li><span class="name">${escapeHtml(it.name)}</span><span class="fill"></span><span class="qty">x${it.qty}</span></li>`;
    });
    html += `</ul></div>`;
  }

  // 提袋 / 運費
  const extras = [];
  if (o.bagQty && Number(o.bagQty) > 0) extras.push(`提袋 x${o.bagQty}${o.bagFee ? `（+$${o.bagFee}）` : ""}`);
  if (o.shipPlan) extras.push(`運費方案：${o.shipPlan}${o.shipFee ? `（$${o.shipFee}）` : ""}`);
  if (extras.length) html += section("其他費用", extras.map(escapeHtml).join("　"));

  if (o.notes.length){
    html += section("備註", o.notes.map(escapeHtml).join("　"));
  }

  // 金額
  if (o.totalAmount){
    html += `<div class="amount-row"><span class="label">合計金額</span><span class="value">$${escapeHtml(o.totalAmount)}</span></div>`;
  } else if (o.productAmount){
    html += `<div class="amount-row"><span class="label">商品金額</span><span class="value">$${escapeHtml(o.productAmount)}</span></div>`;
  }

  html += `</div>`;
  return html;
}

function section(label, value){
  return `<div class="section"><div class="section-label">${label}</div><div class="section-value">${value}</div></div>`;
}

function escapeHtml(s){
  return normalizeText(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

async function runSearch(){
  const phone = normalizeText(document.getElementById("phoneInput").value);
  const statusEl = document.getElementById("status-msg");
  const resultsEl = document.getElementById("results");
  const btn = document.getElementById("searchBtn");

  const phoneNorm = normalizePhone(phone);
  if (!phoneNorm){
    statusEl.textContent = "請先輸入手機號碼再查詢";
    resultsEl.innerHTML = "";
    return;
  }

  btn.disabled = true;
  btn.textContent = "查詢中...";
  statusEl.textContent = "查詢中，請稍候...";
  resultsEl.innerHTML = "";

  const [allOrders, trackingList] = await Promise.all([
    loadAllOrders(),
    loadTrackingData()
  ]);

  const matched = allOrders
    .filter(o => normalizePhone(o.buyerPhone) === phoneNorm)
    .sort((a, b) => (b.time || "").localeCompare(a.time || ""));

  attachStatus(matched, trackingList);

  btn.disabled = false;
  btn.textContent = "查詢訂單";

  if (matched.length === 0){
    statusEl.textContent = "";
    resultsEl.innerHTML = `
      <div class="empty-state">
        <div class="icon">🔍</div>
        <p>查無符合「${escapeHtml(phone)}」的訂單</p>
        <p>請確認手機號碼是否與訂購時填寫的一致</p>
      </div>`;
    return;
  }

  statusEl.textContent = `找到 ${matched.length} 筆訂單`;
  resultsEl.innerHTML = matched.map(renderOrder).join("");
}

/* 支援表單送出後自動帶入電話並直接查詢，
   例如：order-query.html?phone=0912345678 */
window.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  const phone = params.get("phone");
  if (phone){
    document.getElementById("phoneInput").value = phone;
    runSearch();
  }
});
</script>
